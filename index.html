<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underwick</title>
<style>html, body { margin: 0; height: 100%; background: #000; }</style>
<script src="wasm_exec.js"></script>

  const go = new Go();
